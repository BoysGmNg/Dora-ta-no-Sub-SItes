
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora-ta-no Sub - Future 9000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow-color: #00ffff;
            --primary-color: #0d1a2d;
            --secondary-color: #1a3a5f;
            --accent-color: #00d4ff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--primary-color);
            color: #e0f7ff;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        .hero-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #05080f;
            perspective: 1000px;
        }

        .interactive-card {
            width: 90vw;
            max-width: 800px;
            height: 60vh;
            max-height: 500px;
            position: relative;
            border-radius: 1.5rem;
            background: #1a2a45;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border: 1px solid var(--accent-color);
        }

        .card-layer {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease-out;
        }
        
        .card-layer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        
        .card-content {
            transform: translateZ(120px);
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color), 0 0 40px rgba(0, 255, 255, 0.5);
        }
        
        .card-background { transform: translateZ(0px); }
        .card-midground { transform: translateZ(50px); }
        .card-foreground { transform: translateZ(100px); }
        
        .card-glare {
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.2s ease-out;
            pointer-events: none;
        }

        .text-glow {
            text-shadow: 0 0 5px var(--glow-color), 0 0 10px var(--glow-color);
        }

        .section {
            padding: 8rem 1rem;
            position: relative;
            overflow: hidden;
            z-index: 10;
            background-color: var(--primary-color);
        }
        
        .section-bg-gfx {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            transform: translate(-50%, -50%);
            background-image: radial-gradient(circle, rgba(26, 58, 95, 0.3) 0%, transparent 60%);
            z-index: -1;
            opacity: 0.5;
        }

        .card {
            background: rgba(13, 26, 45, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .card:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 40%);
            transform-origin: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover:before {
            opacity: 1;
            animation: rotate 6s linear infinite;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.5);
        }
        
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .film-card {
            aspect-ratio: 2 / 3;
            background-size: cover;
            background-position: center;
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 1rem;
            transition: transform 0.3s ease;
        }
        .film-card:hover { transform: scale(1.05); }
        .film-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
        }
        .film-title {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: bold;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .film-card:hover .film-title {
            transform: translateY(0);
            opacity: 1;
        }

        .animated-element {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s cubic-bezier(0.165, 0.84, 0.44, 1), transform 1s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .animated-element.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .nav-link {
            position: relative;
            color: #e0f7ff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent-color);
            transform-origin: bottom right;
            transition: transform 0.3s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .nav-link:hover { color: var(--accent-color); }
        .nav-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        
        #mobile-menu-container { perspective: 1000px; }
        #mobile-menu {
            opacity: 0;
            transform: scale(0.95);
            transform-style: preserve-3d;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            pointer-events: none;
        }
        #mobile-menu.menu-open {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        #mobile-menu.menu-open a {
            opacity: 1;
            transform: rotateX(0deg);
        }
        #mobile-menu a {
            opacity: 0;
            transform: rotateX(-90deg);
            transform-origin: top center;
            transition: opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1), transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #mobile-menu.menu-open a:nth-child(1) { transition-delay: 0.1s; }
        #mobile-menu.menu-open a:nth-child(2) { transition-delay: 0.2s; }
        #mobile-menu.menu-open a:nth-child(3) { transition-delay: 0.3s; }
        #mobile-menu.menu-open a:nth-child(4) { transition-delay: 0.4s; }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .indonesia-gold {
            background: linear-gradient(45deg, #ff0000, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
    </style>
